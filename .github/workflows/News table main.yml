name: Stable Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Stable Source
        run: |
          # SM8550 Stable Kernel Source
          git clone --depth=1 https://github.com/The-Cyber-Anarchist/kernel_oneplus_sm8550 kernel_source

      - name: Download Clang
        run: |
          mkdir clang
          cd clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747.tar.gz
          tar -xf *.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel_source
          # SM8550 Defconfig nivadne
          DEFCONFIG_FILE="arch/arm64/configs/vendor/sm8550_defconfig"
          
          # Kpatch Next (APatch) sathi Configs ऍड करणे
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KPATCH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG_FILE
          echo "CONFIG_DYNAMIC_FTRACE=y" >> $DEFCONFIG_FILE

          make O=out ARCH=arm64 vendor/sm8550_defconfig
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus12R-Stable-Image
          path: kernel_source/out/arch/arm64/boot/Image.gz
          
