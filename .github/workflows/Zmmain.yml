name: Build OnePlus 12R Custom Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: alpha-16.2
          fetch-depth: 0

      - name: Setup Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm python3 curl git zip wget

      - name: Setup KernelSU-Next
        run: |
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git ksu_next
          cd ksu_next
          bash kernel/setup.sh next
          cd ..

      - name: Setup KPatch-Next
        run: |
          git clone --depth=1 https://github.com/tervsea/KPatch-Next.git kpatch_folder
          cd kpatch_folder
          bash patch.sh --dir .. --patch
          cd ..

      - name: Build Kernel (OnePlus 12R)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vendor/ace3_defconfig
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-android- \
                      CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../OnePlus12R-AlphaDroid-Kernel.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Kernel-OnePlus12R
          path: OnePlus12R-AlphaDroid-Kernel.zip
          
