name: Build KSU + KPatch Safe Kernel (No Bootloop)

on:
push:
branches:
- "16.2"
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: 📥 Checkout Source
  uses: actions/checkout@v4

- name: 🛠 Install Dependencies
  run: |
    sudo apt update
    sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
    libncurses5-dev python3 clang lld ccache zip

- name: ⚡ Setup Clang (Stable)
  run: |
    git clone --depth=1 https://github.com/llvm/llvm-project clang
    echo "$PWD/clang/bin" >> $GITHUB_PATH

- name: 🔧 Patch Kernel Config (KPatch Friendly + KSU Safe)
  run: |
    DEFCONFIG=arch/arm64/configs/vendor/oneplus_defconfig

    sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/g' $DEFCONFIG
    sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/g' $DEFCONFIG

    echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
    echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
    echo "CONFIG_DEBUG_INFO=y" >> $DEFCONFIG
    echo "CONFIG_KPROBES=y" >> $DEFCONFIG
    echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
    echo "CONFIG_LIVEPATCH=y" >> $DEFCONFIG

- name: 🏗 Build Kernel
  run: |
    export ARCH=arm64
    export SUBARCH=arm64

    make O=out vendor/oneplus_defconfig

    make -j$(nproc) O=out \
    CC=clang \
    LLVM=1 \
    LLVM_IAS=1 \
    KCFLAGS="-O2 -w"

- name: 📦 Clone AnyKernel3
  run: |
    git clone https://github.com/osm0sis/AnyKernel3 ak3

- name: ⚙️ Setup AnyKernel
  run: |
    cd ak3
    sed -i 's/device.name1=.*/device.name1=OnePlus12R/g' anykernel.sh

- name: 📂 Copy Kernel Image
  run: |
    cp out/arch/arm64/boot/Image ak3/

- name: 🗜 Create Flashable Zip
  run: |
    cd ak3
    zip -r9 ../KSU-KPatch-SAFE-Kernel.zip *

- name: 📤 Upload Kernel Zip
  uses: actions/upload-artifact@v4
  with:
    name: KSU-KPATCH-SAFE
    path: KSU-KPatch-SAFE-Kernel.zip
