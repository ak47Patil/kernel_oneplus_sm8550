name: Build KSU + KPatch Kernel

on:
  push:
    branches:
      - alpha-16.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev python3 ccache zip python3-pip

      - name: ⚡ Setup Clang (Proton)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: 🧩 Integrate KernelSU
        run: |
          # This command automatically integrates KSU into your kernel source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: 🔧 Patch Kernel Config (Kalama)
        run: |
          DEFCONFIG=arch/arm64/configs/vendor/kalama_defconfig
          
          # Disable LTO/CFI to prevent build errors with Kprobes/KSU
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_NONE=y/g' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG_THIN=y/CONFIG_LTO_CLANG_NONE=y/g' $DEFCONFIG
          
          {
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KSU=y"
          } >> $DEFCONFIG

      - name: 🏗 Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/clang/bin:$PATH"
          
          # Use specialized make flags for modern kernels
          make -j$(nproc) O=out \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS
                      
