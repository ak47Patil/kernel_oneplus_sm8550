name: Build KSU + KPatch Kernel

on:
  push:
    branches:
      - alpha-16.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4

      - name: 🛠 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev python3 ccache zip aarch64-linux-gnu-gcc

      - name: ⚡ Setup Clang (PlaygroundTC)
        run: |
          git clone --depth=1 https://gitlab.com/PixelOS-Devices/playgroundtc.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: 🔧 Patch Kernel Config (Kalama)
        run: |
          # Kalama sathi config path check kara
          DEFCONFIG=arch/arm64/configs/vendor/kalama_defconfig
          
          # LTO ani CFI band karne (Stability sathi garjeche)
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG_NONE=y/g' $DEFCONFIG
          sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/g' $DEFCONFIG

          # KSU ani KPatch sathi required flags
          {
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_DEBUG_INFO=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_LIVEPATCH=y"
          } >> $DEFCONFIG

      - name: 🏗 Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Make output directory
          mkdir -p out

          # Generate Config
          make O=out vendor/kalama_defconfig
          
          # Start Compilation
          make -j$(nproc) O=out \
               CC=clang \
               LLVM=1 \
               LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               KCFLAGS="-O2 -w"

      - name: 📦 Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3

      - name: 📂 Copy Kernel Image
        run: |
          # Image file konti banli te check karun copy karel
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ak3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz ak3/
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ak3/
          fi

      - name: 🗜 Create Flashable Zip
        run: |
          cd ak3
          zip -r9 ../KSU-KPatch-Kernel.zip * -x .git*

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Zip
          path: KSU-KPatch-Kernel.zip
          
