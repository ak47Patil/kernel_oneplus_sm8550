name: Build KSU + KPatch Safe Kernel

on:
  push:
    branches:
      - alpha-16.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev python3 clang lld ccache zip

      - name: Patch Kernel Config
        run: |
          DEFCONFIG=arch/arm64/configs/vendor/oneplus_defconfig
          CH_CONFIG="./scripts/config --file $DEFCONFIG"
          
          # Disable LTO and CFI for KPatch stability
          $CH_CONFIG -d LTO_CLANG
          $CH_CONFIG -d CFI_CLANG
          
          # Enable Required KPatch/KSU features
          $CH_CONFIG -e KALLSYMS
          $CH_CONFIG -e KALLSYMS_ALL
          $CH_CONFIG -e DEBUG_INFO
          $CH_CONFIG -e KPROBES
          $CH_CONFIG -e HAVE_KPROBES
          $CH_CONFIG -e LIVEPATCH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          # Use system clang for speed unless a specific version is required
          make O=out vendor/oneplus_defconfig
          make -j$(nproc) O=out \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-O2 -w"

      - name: Package Kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r9 ../KSU-KPatch-Kernel.zip * -x .git\*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Zip
          path: KSU-KPatch-Kernel.zip
          
