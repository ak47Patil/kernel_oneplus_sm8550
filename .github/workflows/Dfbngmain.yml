name: Stable Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Official Source
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8550 kernel_source

      - name: Nuclear Clean Kconfigs
        run: |
          cd kernel_source
          echo "Deep cleaning sagle oplus references..."
          # Purn source madhlya Kconfig files madhun 'oplus' aslelya lines kaadhne
          find . -name "Kconfig*" -exec sed -i '/oplus/d' {} +
          find . -name "Kconfig*" -exec sed -i '/kernelFwUpdate/d' {} +
          find . -name "Kconfig*" -exec sed -i '/tri_state_key/d' {} +
          
          echo "Cleaning finished."

      - name: Build Kernel Process
        run: |
          cd kernel_source
          # SM8550 Defconfig शोधणे
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*defconfig" | grep "sm8550" | head -n 1)
          [ -z "$DEFCONFIG_FILE" ] && DEFCONFIG_FILE="arch/arm64/configs/vendor/sm8550_defconfig"
          
          # Kpatch Next (APatch) Configs ऍड करणे
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KPATCH=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_DYNAMIC_FTRACE=y" >> "$DEFCONFIG_FILE"

          make O=out ARCH=arm64 $(basename "$DEFCONFIG_FILE")
          
          # System Clang वापरून Compilation सुरू करणे
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus12R-Official-Kernel
          path: kernel_source/out/arch/arm64/boot/Image.gz
          
