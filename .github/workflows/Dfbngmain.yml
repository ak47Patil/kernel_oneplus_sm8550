name: Stable Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Official Source
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8550 kernel_source

      - name: Deep Scrub Missing References
        run: |
          cd kernel_source
          find . -name "Kconfig*" | while read -r kfile; do
            grep "source " "$kfile" | cut -d'"' -f2 | while read -r spath; do
              if [[ "$spath" != \$* ]] && [ ! -f "$spath" ] && [ ! -d "$spath" ]; then
                sed -i "\|source \"$spath\"|d" "$kfile"
              fi
            done
          done

      - name: Build Kernel Process
        run: |
          cd kernel_source
          # Find the actual defconfig file
          # OnePlus often puts it in arch/arm64/configs/vendor/
          REAL_DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | grep -E "8550|kalama" | head -n 1)
          echo "Found defconfig: $REAL_DEFCONFIG"
          
          # Extract just the filename for the 'make' command
          DEF_NAME=$(basename "$REAL_DEFCONFIG")
          
          # Inject APatch/Kpatch requirements
          echo "CONFIG_KPROBES=y" >> "$REAL_DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$REAL_DEFCONFIG"
          echo "CONFIG_KPATCH=y" >> "$REAL_DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$REAL_DEFCONFIG"
          echo "CONFIG_DYNAMIC_FTRACE=y" >> "$REAL_DEFCONFIG"

          # Start Build
          make O=out ARCH=arm64 "$DEF_NAME"
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus12R-Official-Kernel
          path: kernel_source/out/arch/arm64/boot/Image.gz
