name: Stable Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Official Source
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8550 kernel_source

      - name: Deep Scrub Missing References
        run: |
          cd kernel_source
          echo "Starting deep scrub of missing files..."
          # Find all Kconfig files and check every 'source' line
          find . -name "Kconfig*" | while read -r kfile; do
            # Extract paths from source "path/to/file" lines
            grep "source " "$kfile" | cut -d'"' -f2 | while read -r spath; do
              # If the path doesn't exist and isn't a variable ($), delete the line
              if [[ "$spath" != \$* ]] && [ ! -f "$spath" ] && [ ! -d "$spath" ]; then
                echo "Removing broken reference: $spath from $kfile"
                sed -i "\|source \"$spath\"|d" "$kfile"
              fi
            done
          done
          echo "Scrubbing complete."

      - name: Build Kernel Process
        run: |
          cd kernel_source
          # Detect SM8550 defconfig
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*defconfig" | grep "sm8550" | head -n 1)
          [ -z "$DEFCONFIG_FILE" ] && DEFCONFIG_FILE="arch/arm64/configs/vendor/sm8550_defconfig"
          
          # Inject APatch/Kpatch requirements
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KPATCH=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_DYNAMIC_FTRACE=y" >> "$DEFCONFIG_FILE"

          # Run make
          make O=out ARCH=arm64 $(basename "$DEFCONFIG_FILE")
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus12R-Official-Kernel
          path: kernel_source/out/arch/arm64/boot/Image.gz
          
